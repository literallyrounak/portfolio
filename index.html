<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://github.com/literallyrounak.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rounak Kumar Gupta | Portfolio</title>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <style>
      html.dark body { background-color: #1a1b26; color: #c0caf5; }
      html:not(.dark) body { background-color: #fafafa; color: #131316; }
    </style>
    <meta
      name="description"
      content="A passionate developer from India. Currently working on Whismur, a real-time chat application. Learning DSA & MERN stack."
    />
    <meta name="author" content="Rounak Kumar Gupta" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://literallyrounak.me/" />
    <meta
      property="og:title"
      content="Rounak Kumar Gupta | Portfolio"
    />
    <meta
      property="og:description"
      content="A passionate developer from India. Currently working on Whismur, a real-time chat application. Learning DSA & MERN stack."
    />
    <meta
      property="og:image"
      content="https://github.com/literallyrounak.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://literallyrounak.me/" />
    <meta
      property="twitter:title"
      content="Rounak Kumar Gupta | Full-Stack Developer"
    />
    <meta
      property="twitter:description"
      content="A passionate developer from India. Currently working on Whismur, a real-time chat application. Learning DSA & MERN stack."
    />
    <meta
      property="twitter:image"
      content="https://github.com/literallyrounak.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
